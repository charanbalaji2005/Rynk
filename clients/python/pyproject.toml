[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rynk"
version = "0.3.0"
description = "Run one command, get a live link on your network. Python launcher and API for Rynk."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Topic :: Software Development :: Build Tools",
  "Topic :: System :: Networking",
]

[project.scripts]
rynk = "rynk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
